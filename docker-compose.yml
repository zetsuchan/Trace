services:
  db:
    image: postgres:16-alpine
    container_name: trace-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trace
    volumes:
      - trace-data:/var/lib/postgresql/data

volumes:
  trace-data:
